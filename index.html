<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Buscá y Encontrá">
<title>Buscá y Encontrá</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: libro de páginas en grilla → juego a pantalla completa (dibujo + bandeja de 10 objetos). Mundo nocturno espacial, un solo tema. */
:root{
  --night:#0b1430; --deep:#14204a; --panel:#1c2a5e; --line:#2c3d7c;
  --star:#ffd23f; --mint:#4fe3b0; --coral:#ff7b5c; --ink:#f4f6ff; --muted:#a8b3dc;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-size:14px}
*,*::before,*::after{box-sizing:border-box}
img{max-width:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(1.5px 1.5px at 12% 18%,#fff8 50%,transparent 51%),
   radial-gradient(1px 1px at 33% 72%,#fff7 50%,transparent 51%),
   radial-gradient(2px 2px at 58% 12%,#ffe9a6 50%,transparent 51%),
   radial-gradient(1px 1px at 76% 44%,#fff8 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 90% 82%,#fff6 50%,transparent 51%),
   radial-gradient(1px 1px at 22% 92%,#fff6 50%,transparent 51%),
   radial-gradient(1px 1px at 47% 40%,#fff5 50%,transparent 51%),
   radial-gradient(900px 500px at 85% -10%,#2a3f8f55,transparent 70%),
   radial-gradient(700px 500px at -10% 110%,#3b2a7a44,transparent 70%);}

/* ---------- HOME ---------- */
#home{position:relative;z-index:1;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 .lupa{display:inline-block;color:var(--star);transform:rotate(-8deg)}
.sub{margin:6px 0 0;color:var(--muted);font-size:16px;max-width:52ch}
.total{font-family:var(--display);font-size:18px;color:var(--muted);display:flex;align-items:center;gap:10px}
.total b{color:var(--star);font-size:26px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;padding:8px 8px 12px;border-radius:20px;background:var(--deep);
  box-shadow:inset 0 0 0 2px var(--line);transition:transform .18s ease,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 2px var(--star)}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block;background:var(--panel)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px}
.card .num{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.prog{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog b{color:var(--star)}
.bar{height:8px;border-radius:99px;background:var(--line);margin:0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--star);border-radius:99px;box-shadow:0 0 8px #ffd23f88}
.card .num{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.book{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;padding:10px 10px 16px;border-radius:24px;background:var(--deep);
  box-shadow:inset 0 0 0 2px var(--line),0 10px 0 -4px var(--panel),0 18px 0 -8px var(--line);transition:transform .18s ease,box-shadow .18s}
.book:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:inset 0 0 0 2px var(--star),0 10px 0 -4px var(--panel),0 18px 0 -8px var(--line)}
.book:active{transform:scale(.97)}
.book img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 30%;border-radius:16px;display:block;background:var(--panel)}
.book h3{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;margin:0;padding:0 6px;text-wrap:balance}
.book .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 6px;color:var(--muted);font-size:15px}
.book.done::after{content:"★";position:absolute;top:0;right:0;width:52px;height:52px;display:grid;place-items:center;font-size:30px;color:var(--night);background:var(--star);border-radius:50%;box-shadow:0 4px 14px #0008;transform:rotate(12deg)}
.crumb{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:8px 16px 8px 10px;border-radius:999px;background:var(--deep);box-shadow:inset 0 0 0 2px var(--line);
  font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink)}
.crumb svg{width:22px;height:22px}
.crumb:hover{box-shadow:inset 0 0 0 2px var(--star)}
.card.done::after{content:"★";position:absolute;top:2px;right:2px;width:44px;height:44px;display:grid;place-items:center;
  font-size:26px;color:var(--night);background:var(--star);border-radius:50%;box-shadow:0 4px 14px #0008;transform:rotate(12deg)}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;color:var(--muted);font-size:16px;padding-top:12px}
.foot>span{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.linkbtn{padding:12px 22px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);color:var(--ink);background:var(--deep);font-family:var(--display);font-weight:800;font-size:18px}
.linkbtn:hover{color:var(--ink)}
.linkbtn.warn{box-shadow:inset 0 0 0 2px var(--coral);color:var(--coral)}

/* ---------- GAME ---------- */
#game{position:fixed;inset:0;z-index:5;background:var(--night);display:grid;
  grid-template-columns:1fr auto;grid-template-rows:1fr;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#view{position:relative;overflow:hidden;touch-action:none;background:#060b1d;cursor:grab}
#view.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage img{display:block;max-width:none;-webkit-user-drag:none;pointer-events:none}
#marks{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.ring{fill:none;stroke:var(--star);stroke-linecap:round;filter:drop-shadow(0 0 6px #ffd23faa);animation:draw .6s ease-out both}
.ring.halo{stroke:#fff;opacity:.55;animation:draw .6s ease-out both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.pulse{fill:none;stroke:var(--mint);animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{opacity:0;transform:scale(2.4)}30%{opacity:1}100%{opacity:0;transform:scale(1)}}

.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:3}
.hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;background:#0b1430cc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 0 0 2px #ffffff1a}
.ibtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--panel);box-shadow:inset 0 0 0 2px #ffffff22}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:26px;height:26px}
.count{font-family:var(--display);font-weight:800;font-size:22px;padding:0 8px;font-variant-numeric:tabular-nums}
.count b{color:var(--star)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:3}
.hint{background:var(--star);color:var(--night);box-shadow:0 4px 14px #0006}
.hint.wait{opacity:.45}

.toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-10px);opacity:0;transition:.25s;z-index:4;pointer-events:none;
  font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,30px);padding:8px 20px;border-radius:18px;background:var(--ink);color:var(--night);
  box-shadow:0 8px 24px #0009;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--mint)}

#tray{background:var(--deep);box-shadow:inset 2px 0 0 var(--line);display:grid;gap:8px;align-content:center;justify-content:center;
  --chip:64px;grid-template-columns:repeat(2,var(--chip));padding:10px}
.chip{position:relative;width:var(--chip);height:var(--chip);border-radius:16px;background-color:#fff;background-repeat:no-repeat;
  box-shadow:0 0 0 3px var(--panel),0 3px 0 3px #0005;transition:transform .15s}
.chip:active{transform:scale(.93)}
.chip.wig{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
.chip.found{box-shadow:0 0 0 3px var(--star),0 3px 0 3px #0005}
.chip.found::before{content:"";position:absolute;inset:0;border-radius:16px;background:#0b143099}
.chip.found::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--chip)*.5);color:var(--star);
  text-shadow:0 2px 6px #000a;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1)}}

@media (orientation:portrait){
  #game{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #tray{box-shadow:inset 0 2px 0 var(--line)}
}

.burst{position:absolute;pointer-events:none;z-index:2;font-size:22px;color:var(--star);animation:fly .8s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(140deg)}}
.miss{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #ffffffaa;pointer-events:none;z-index:2;animation:miss .45s ease-out forwards}
@keyframes miss{to{transform:scale(1.8);opacity:0}}

.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--muted)}

/* ---------- WIN ---------- */
#win{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#060b1dcc;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.winbox{position:relative;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:26px 28px;border-radius:28px;background:var(--deep);
  box-shadow:inset 0 0 0 3px var(--star),0 20px 60px #000a;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.winbox .stars{font-size:46px;color:var(--star);letter-spacing:6px;line-height:1}
.winbox h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,42px);margin:0;line-height:1.05;text-wrap:balance}
.winbox .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bigbtn{font-family:var(--display);font-weight:800;font-size:22px;padding:12px 24px;border-radius:999px;background:var(--star);color:var(--night);box-shadow:0 4px 0 #b8901b}
.bigbtn.alt{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 #0b1430}
.bigbtn:active{transform:translateY(3px);box-shadow:none}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>


<div class="sky"></div>

<main id="home">
  <div class="wrap">
    <div class="head">
      <div>
        <h1>Buscá y <span class="lupa">Encontrá</span></h1>
        <p class="sub" id="sub">Elegí una colección.</p>
      </div>
      <div class="total">Estrellas <b id="tot">0</b> / <span id="totmax">160</span></div>
    </div>
    <button class="crumb" id="libBack" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Todas las colecciones</button>
    <div class="books" id="books"></div>
    <div class="grid" id="grid" hidden></div>
    <div class="foot">
      <button class="linkbtn" id="resetBtn" type="button">↺ Reiniciar progreso</button>
      <span id="resetAsk" hidden>¿Empezar de cero? Se borran todas las estrellas.
        <button class="linkbtn warn" id="resetYes" type="button">Sí, reiniciar</button>
        <button class="linkbtn" id="resetNo" type="button">No</button></span>
    </div>
  </div>
</main>

<section id="game" hidden>
  <div id="view">
    <div id="stage"><img id="pic" alt=""><svg id="marks"></svg></div>
    <div class="loading" id="loading">Cargando…</div>
    <div class="hud">
      <div class="pill">
        <button class="ibtn" id="backBtn" type="button" aria-label="Volver a la colección">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span class="count"><b id="cnt">0</b>/<span id="cntMax">10</span></span>
      </div>
      <button class="ibtn hint" id="hintBtn" type="button" aria-label="Pista">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
    </div>
    <div class="zoom">
      <button class="ibtn" id="zin" type="button" aria-label="Acercar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ibtn" id="zout" type="button" aria-label="Alejar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <div id="tray"></div>
</section>

<div id="win" hidden>
  <canvas id="confetti"></canvas>
  <div class="winbox">
    <div class="stars">★★★</div>
    <h2 id="winTitle">¡Encontraste todo!</h2>
    <div class="acts">
      <button class="bigbtn" id="nextBtn" type="button">Siguiente página</button>
      <button class="bigbtn alt" id="againBtn" type="button">↺ Jugar otra vez</button>
      <button class="bigbtn alt" id="homeBtn" type="button">Volver a la colección</button>
    </div>
  </div>
</div>

}
function animateTo(t,ms){
  cancelAnimationFrame(anim);const f={...cam};t=clampCam({...t});const t0=performance.now();ms=ms||450;
  const step=now=>{let k=Math.min(1,(now-t0)/ms);k=1-Math.pow(1-k,3);
    cam.s=f.s+(t.s-f.s)*k;cam.x=f.x+(t.x-f.x)*k;cam.y=f.y+(t.y-f.y)*k;apply();if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
function zoomAt(px,py,ns,animate){
  ns=Math.min(maxS,Math.max(minS,ns));const ix=(px-cam.x)/cam.s,iy=(py-cam.y)/cam.s;
  const t={s:ns,x:px-ix*ns,y:py-iy*ns};if(animate)animateTo(t,260);else{Object.assign(cam,clampCam(t));apply()}
}
$('zin').onclick=()=>zoomAt(VW/2,VH/2,cam.s*1.6,true);
$('zout').onclick=()=>zoomAt(VW/2,VH/2,cam.s/1.6,true);

function boxPx(b){return{x:b[0]/100*P.w,y:b[1]/100*P.h,w:b[2]/100*P.w,h:b[3]/100*P.h}}
function chipStyle(el,b){
  const r=boxPx(b);const s=Math.min(Math.max(r.w,r.h)*1.18,P.w*.999,P.h*.999);const left=Math.min(P.w-s,Math.max(0,r.x+r.w/2-s/2)),top=Math.min(P.h-s,Math.max(0,r.y+r.h/2-s/2));
  el.style.backgroundImage='url("img/'+P.id+'.webp")';
  el.style.backgroundSize=(P.w/s*100)+'% auto';
  el.style.backgroundPosition=(left/(P.w-s)*100)+'% '+(top/(P.h-s)*100)+'%';
}
function drawRing(it,bi,animate){
  const r=boxPx(it.b[bi]);const pad=Math.max(r.w,r.h)*.12+P.w*.004;
  const rx=r.w/2+pad,ry=r.h/2+pad,cx=r.x+r.w/2,cy=r.y+r.h/2,sw=Math.max(4,P.w*.0035);
  const len=Math.PI*(3*(rx+ry)-Math.sqrt((3*rx+ry)*(rx+3*ry)));
  const mk=cls=>{const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    e.setAttribute('cx',cx);e.setAttribute('cy',cy);e.setAttribute('rx',rx);e.setAttribute('ry',ry);
    e.setAttribute('class',cls);e.style.strokeWidth=cls.includes('halo')?sw*2.2:sw;
    e.style.strokeDasharray=len;e.style.setProperty('--len',len);if(!animate)e.style.animation='none';marks.appendChild(e)};
  mk('ring halo');mk('ring');
}
function toast(t,good){const e=$('toast');e.textContent=t;e.className='toast on'+(good?' good':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',1800)}

function openPage(id){
  P=PAGES.find(p=>p.id===id);if(!P){showHome();return}
  $('home').hidden=true;$('game').hidden=false;$('win').hidden=true;
  marks.innerHTML='';marks.setAttribute('width',P.w);marks.setAttribute('height',P.h);marks.setAttribute('viewBox','0 0 '+P.w+' '+P.h);
  pic.width=P.w;pic.height=P.h;stage.style.width=P.w+'px';stage.style.height=P.h+'px';
  $('loading').hidden=false;stage.style.visibility='hidden';
  pic.onload=()=>{$('loading').hidden=true;stage.style.visibility='visible';measure(false)};
  pic.src='img/'+P.id+'.webp';
  tray.innerHTML='';
  const F=found(P.id);
  P.items.forEach((it,i)=>{
    const c=document.createElement('button');c.type='button';c.className='chip'+(F.includes(i)?' found':'');
    c.setAttribute('aria-label',label(it.n));c.title=label(it.n);chipStyle(c,it.b[0]);
    c.onclick=()=>{audio();c.classList.remove('wig');void c.offsetWidth;c.classList.add('wig');
      if(F.includes(i)){toast('¡'+label(it.n)+'!',true);say('¡Ya encontraste '+it.n+'!');}
      else{toast('¿Dónde está '+it.n+'?');say('¿Dónde está '+it.n+'?');}};
    tray.appendChild(c);
    if(F.includes(i))drawRing(it,0,false);
  });
  $('cnt').textContent=F.length;$('cntMax').textContent=P.items.length;
  layoutTray();measure(false);
}
function showHome(bk){P=null;$('game').hidden=true;$('win').hidden=true;$('home').hidden=false;renderHome(bk);stopConfetti();scrollTo(0,0)}
function layoutTray(){
  if(!P)return;const n=P.items.length,gap=8,pad=20,port=innerHeight>innerWidth;let cols,chip;
  if(port){const rows=n>10?3:2;cols=Math.ceil(n/rows);chip=Math.min(80,(innerWidth-pad-gap*(cols-1))/cols)}
  else{cols=n>10?3:2;const rows=Math.ceil(n/cols);chip=Math.min(84,(innerHeight-pad-gap*(rows-1))/rows)}
  tray.style.setProperty('--chip',Math.floor(chip)+'px');tray.style.gridTemplateColumns='repeat('+cols+',var(--chip))';
}

function burst(px,py){
  for(let k=0;k<9;k++){const e=document.createElement('div');e.className='burst';e.textContent='★';
    const a=Math.random()*Math.PI*2,d=50+Math.random()*60;e.style.left=px-10+'px';e.style.top=py-14+'px';
    e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');
    view.appendChild(e);setTimeout(()=>e.remove(),900)}
}
function tap(px,py){
  if(!P)return;audio();
  const ix=(px-cam.x)/cam.s,iy=(py-cam.y)/cam.s,pad=20/cam.s,F=found(P.id);
  let best=null,bd=1e9;
  P.items.forEach((it,i)=>it.b.forEach((b,bi)=>{const r=boxPx(b);
    const dx=Math.max(r.x-ix,0,ix-(r.x+r.w)),dy=Math.max(r.y-iy,0,iy-(r.y+r.h)),d=Math.hypot(dx,dy);
    if(d<=pad&&d<bd){bd=d;best={i,bi}}}));
  if(best&&!F.includes(best.i)){
    const it=P.items[best.i];F.push(best.i);save();
    drawRing(it,best.bi,true);burst(px,py);sGood();
    tray.children[best.i].classList.add('found');$('cnt').textContent=F.length;
    toast('¡'+label(it.n)+'!',true);say('¡Muy bien! ¡'+it.n+'!');
    if(F.length===P.items.length)setTimeout(win,1300);
  }else if(best){burst(px,py)}
  else{const m=document.createElement('div');m.className='miss';m.style.left=px+'px';m.style.top=py+'px';view.appendChild(m);setTimeout(()=>m.remove(),500);sMiss()}
}
let hintBusy=false;
$('hintBtn').onclick=()=>{
  if(!P||hintBusy)return;audio();const F=found(P.id);const left=P.items.map((_,i)=>i).filter(i=>!F.includes(i));if(!left.length)return;
  const i=left[Math.floor(Math.random()*left.length)],it=P.items[i],r=boxPx(it.b[0]);
  hintBusy=true;$('hintBtn').classList.add('wait');
  const s=Math.min(maxS,Math.max(cam.s,base*2.2));
  animateTo({s,x:VW/2-(r.x+r.w/2)*s,y:VH/2-(r.y+r.h/2)*s},600);
  setTimeout(()=>{const e=document.createElementNS('http://www.w3.org/2000/svg','circle');const cx=r.x+r.w/2,cy=r.y+r.h/2;
    e.setAttribute('cx',cx);e.setAttribute('cy',cy);e.setAttribute('r',Math.max(r.w,r.h)*.75+P.w*.01);e.setAttribute('class','pulse');
    e.style.strokeWidth=Math.max(5,P.w*.005);e.style.transformOrigin=cx+'px '+cy+'px';marks.appendChild(e);
    setTimeout(()=>{e.remove();hintBusy=false;$('hintBtn').classList.remove('wait')},3300)},450);
  toast('Mirá por acá… ¿'+label(it.n)+'?');say('Mirá por acá. ¿Ves '+it.n+'?');
  tray.children[i].classList.remove('wig');void tray.children[i].offsetWidth;tray.children[i].classList.add('wig');
};
$('backBtn').onclick=()=>{location.hash=P?'b-'+P.book.id:''};

/* ---------- gestures ---------- */
const pts=new Map();let g=null;
view.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  view.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});cancelAnimationFrame(anim);
  const r=view.getBoundingClientRect();
  if(pts.size===1){g={mode:'pan',sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,t:performance.now(),moved:false,multi:false,r}}
  else if(pts.size===2&&g){const [a,b]=[...pts.values()];g.mode='pinch';g.multi=true;
    g.d0=Math.hypot(a.x-b.x,a.y-b.y);g.s0=cam.s;g.mx=(a.x+b.x)/2-r.left;g.my=(a.y+b.y)/2-r.top;g.ix=(g.mx-cam.x)/cam.s;g.iy=(g.my-cam.y)/cam.s;g.r=r}
});
view.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!g)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(g.mode==='pan'&&pts.size===1){const dx=e.clientX-g.sx,dy=e.clientY-g.sy;
    if(!g.moved&&Math.hypot(dx,dy)>9){g.moved=true;view.classList.add('drag')}
    if(g.moved){cam.x=g.cx+dx;cam.y=g.cy+dy;clampCam(cam);apply()}}
  else if(g.mode==='pinch'&&pts.size>=2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    const mx=(a.x+b.x)/2-g.r.left,my=(a.y+b.y)/2-g.r.top;cam.s=Math.min(maxS,Math.max(minS,g.s0*d/g.d0));
    cam.x=mx-g.ix*cam.s;cam.y=my-g.iy*cam.s;clampCam(cam);apply()}
});
function up(e){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(!g)return;
  if(pts.size===1){const [a]=[...pts.values()];g.mode='pan';g.sx=a.x;g.sy=a.y;g.cx=cam.x;g.cy=cam.y;g.moved=true}
  else if(pts.size===0){view.classList.remove('drag');
    if(e.type==='pointerup'&&!g.moved&&!g.multi&&performance.now()-g.t<600)tap(e.clientX-g.r.left,e.clientY-g.r.top);g=null}
}
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,cam.s*Math.exp(-e.deltaY*.0018))},{passive:false});
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
addEventListener('resize',()=>{if(P){layoutTray();requestAnimationFrame(()=>measure(true))}});

/* ---------- win + confetti ---------- */
let cf=null;
function win(){sWin();say('¡Bravo! ¡Encontraste todo!');
  $('winTitle').textContent='¡Encontraste las '+P.items.length+' cosas!';
  $('nextBtn').hidden=P.num>=P.book.pages.length;$('win').hidden=false;confetti()}
function confetti(){const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  const cols=['#ffd23f','#4fe3b0','#ff7b5c','#7aa8ff','#ff9ad5'];
  const ps=Array.from({length:140},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:cols[Math.random()*5|0]}));
  const t0=performance.now();
  const f=now=>{x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(now-t0<5000)cf=requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)};
  cancelAnimationFrame(cf);cf=requestAnimationFrame(f)}
function stopConfetti(){cancelAnimationFrame(cf)}
$('nextBtn').onclick=()=>{stopConfetti();location.hash='p-'+P.book.pages[P.num].id};
$('homeBtn').onclick=()=>{location.hash='b-'+P.book.id};
$('againBtn').onclick=()=>{if(!P)return;stopConfetti();prog[P.id]=[];save();openPage(P.id)};

/* ---------- routing ---------- */
function route(){const h=location.hash,m=h.match(/^#p-(\w+)$/),b=h.match(/^#b-([\w-]+)$/);
  if(m)openPage(m[1]);else showHome(b?BOOKS.find(x=>x.id===b[1]):null)}
addEventListener('hashchange',route);route();
})();
</script>
